{% extends "base.html" %}
{% block title %}Sign in · Demo Monitoring{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Sign in</h2>
  {% if error %}
  <p class="banner" role="alert">Invalid username or password</p>
  {% endif %}
  <form method="post" action="{{ url_for('login_post') }}" class="stack">
    <label>
      Username
      <input name="username" autocomplete="username" required>
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
