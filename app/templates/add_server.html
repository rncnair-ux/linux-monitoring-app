{% extends "base.html" %}
{% block title %}Add server · Demo Monitoring{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Add a Linux server</h2>
  <p class="muted">Nothing is installed on the remote host. The list holds at most 5 servers.</p>
  {% for message in errors %}
  <p class="banner" role="alert">{{ message }}</p>
  {% endfor %}
  <form method="post" action="{{ url_for('add_server_post') }}" class="stack">
    <label>
      Display name
      <input name="name" value="{{ form.name }}" required>
    </label>
    <label>
      Hostname or IP
      <input name="hostname" value="{{ form.hostname }}" required>
    </label>
    <label>
      SSH user
      <input name="ssh_user" value="{{ form.ssh_user }}" autocomplete="off" required>
    </label>
    <label>
      SSH port
      <input name="ssh_port" value="{{ form.ssh_port }}" inputmode="numeric" required>
    </label>
    <label>
      SSH password or private key path
      <input name="ssh_secret" type="password" autocomplete="off" required>
    </label>
    <button type="submit">Add server</button>
  </form>
</section>
{% endblock %}
